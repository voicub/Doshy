# Checks on every push and pull request: the Home Assistant integration (HACS and hassfest) and the app (typecheck and tests).
name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  app:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # node:sqlite needs 22.13 or newer; the Dockerfile uses 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Integration address helper
        run: python3 -m unittest discover -s tests
